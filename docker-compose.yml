version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: askbase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql+asyncpg://postgres:secret@postgres:5432/askbase
      JWT_SECRET: local-development-secret-change-me-in-production-min-32-chars
      JWT_EXPIRES_IN_MINUTES: 15
      JWT_ISSUER: askbase-api
      JWT_AUDIENCE: askbase-clients
      LOG_LEVEL: info
      STORAGE_DIR: /app/storage/documents
      EMBEDDING_PROVIDER: fake
      AI_PROVIDER: fake
    volumes:
      - storage_data:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  storage_data:
