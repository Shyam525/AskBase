name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: askbase_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d askbase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check code formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (ruff)
        run: uv run ruff check .

      - name: Run static type analysis (mypy)
        run: uv run mypy src

      - name: Run automated test suite (pytest)
        run: uv run pytest -v
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:secret@localhost:5432/askbase_test
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long!
